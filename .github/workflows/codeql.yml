name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '21 7 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'go', 'javascript-typescript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby', 'swift' ]
        # Use only 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use only 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality


    # JavaScript/TypeScript is interpreted; Autobuild is a no-op for it but
    # gives CodeQL the language hook it needs.
    - name: Autobuild
      if: matrix.language != 'go'
      uses: github/codeql-action/autobuild@v4

    # Go lives in the ./porcupin workspace and the desktop build needs CGo +
    # the webkit2_41 build tag. Autobuild can't infer this from the repo root,
    # so it produces zero compiled Go, which CodeQL reports as
    # "Go files were found but not processed". The steps below mirror what
    # ci.yml's build-check job does and give CodeQL a real Go build to trace.
    - name: Setup Go (CodeQL Go build)
      if: matrix.language == 'go'
      uses: actions/setup-go@v6
      with:
        go-version: "1.25"
        cache-dependency-path: porcupin/go.sum

    - name: Install Linux GTK deps (CodeQL Go build)
      if: matrix.language == 'go'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

    - name: Manual Go build for CodeQL
      if: matrix.language == 'go'
      working-directory: porcupin
      run: |
        CGO_ENABLED=0 go build -o /dev/null ./cmd/headless
        CGO_ENABLED=1 go build -tags webkit2_41 -o /dev/null .

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
